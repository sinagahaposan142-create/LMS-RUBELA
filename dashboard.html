  <!-- Apply saved theme (light/dark + tema hari besar) before first paint to avoid a flash of the wrong look -->
  <script>
    try {
      var _t = localStorage.getItem('lms_theme');
      document.documentElement.setAttribute('data-theme', _t === 'dark' ? 'dark' : 'light');
    } catch (e) { /* noop */ }
    try {
      var _h = JSON.parse(localStorage.getItem('lms_holiday_cache') || 'null');
      if (_h && _h.v === 1 && /^[a-z][a-z-]{1,23}$/.test(_h.id) && _h.vars) {
        var _r = document.documentElement;
        for (var _k in _h.vars) if (/^--hd-[a-z0-9-]+$/.test(_k)) _r.style.setProperty(_k, String(_h.vars[_k]));
        _r.setAttribute('data-holiday', _h.id);
      }
    } catch (e) { /* noop */ }
  </script>
