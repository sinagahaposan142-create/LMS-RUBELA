<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-page="Dashboard">Dashboard - LMS Rubela</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong mode -->
  <script>
    try {
      var _t = localStorage.getItem('lms_theme');
      document.documentElement.setAttribute('data-theme', _t === 'dark' ? 'dark' : 'light');
    } catch (e) { /* noop */ }
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body class="dash-body">
  <a class="skip-link" href="#content">Lewati ke konten utama</a>
  <aside class="sidebar" id="sidebar" aria-label="Navigasi samping">
    <div class="brand">
      <div class="brand-logo">R</div>
      <div>
        <h1>LMS Rubela</h1>
        <p id="sideRole">Panel</p>
      </div>
      <button type="button" class="sb-toggle" id="sbToggle" aria-label="Ciutkan sidebar" title="Ciutkan sidebar" aria-expanded="true">«</button>
    </div>
    <nav class="side-nav" id="sideNav" aria-label="Menu utama"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">?</div>
        <div class="info">
          <strong id="userName">-</strong>
          <span id="userRole">-</span>
        </div>
      </div>
      <button class="btn btn-secondary btn-block mt-1" id="logoutBtn" style="margin-top:10px;" aria-label="Keluar" title="Keluar">Keluar</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" type="button" title="Buka menu" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <div id="clockContainer"></div>
        <div class="presence-wrap" id="presenceWrap"></div>
        <div class="notif-wrap" id="notifWrap"></div>
        <div id="themeSlot"></div>
        <span class="role-badge" id="roleBadge">-</span>
      </div>
    </header>
    <div class="ticker-bar" id="tickerBar" aria-label="Papan informasi berjalan"></div>
    <main class="content" id="content" tabindex="-1">
      <!-- rendered by role module -->
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi cepat"></nav>

  <!-- Generic modal used by role modules -->
  <div id="genericModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="icon-btn" id="modalClose" type="button" aria-label="Tutup dialog">&times;</button>
      </header>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/idb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/data-search.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/responsive.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/qeditor.js"></script>
  <script src="js/content.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/attendance-insights.js"></script>
  <script src="js/birthday.js"></script>
  <script src="js/visibility.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/verses.js"></script>
  <script src="js/course-hub.js"></script>
  <script src="js/timecapsule.js"></script>
  <script src="js/music.js"></script>
  <script src="js/loginquiz.js"></script>
  <script src="js/jadwal.js"></script>
  <script src="js/rekap.js"></script>
  <script src="js/cbt.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/autograder.js"></script>
  <script src="js/whiteboard.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/guru.js"></script>
  <script src="js/siswa.js"></script>
  <script src="js/orangtua.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
