<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-page="Dashboard">Dashboard - LMS Rubela</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong mode -->
  <script>
    try {
      var _t = localStorage.getItem('lms_theme');
      document.documentElement.setAttribute('data-theme', _t === 'dark' ? 'dark' : 'light');
    } catch (e) { /* noop */ }
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body class="dash-body">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">R</div>
      <div>
        <h1>LMS Rubela</h1>
        <p id="sideRole">Panel</p>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">?</div>
        <div class="info">
          <strong id="userName">-</strong>
          <span id="userRole">-</span>
        </div>
      </div>
      <button class="btn btn-secondary btn-block mt-1" id="logoutBtn" style="margin-top:10px;">Keluar</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" type="button" title="Buka menu" aria-label="Buka menu">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <div id="clockContainer"></div>
        <div class="notif-wrap" id="notifWrap"></div>
        <div id="themeSlot"></div>
        <span class="role-badge" id="roleBadge">-</span>
      </div>
    </header>
    <section class="content" id="content">
      <!-- rendered by role module -->
    </section>
  </div>

  <!-- Generic modal used by role modules -->
  <div id="genericModal" class="modal hidden">
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="icon-btn" id="modalClose" type="button">&times;</button>
      </header>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/responsive.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/qeditor.js"></script>
  <script src="js/content.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/loginquiz.js"></script>
  <script src="js/jadwal.js"></script>
  <script src="js/rekap.js"></script>
  <script src="js/cbt.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/guru.js"></script>
  <script src="js/siswa.js"></script>
  <script src="js/orangtua.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
